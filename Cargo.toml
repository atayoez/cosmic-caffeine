[package]
name = "cosmic-caffeine"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Wayland-native COSMIC panel applet for inhibiting idle/sleep"
repository = "https://github.com/atayozcan/cosmic-caffeine"

[lib]
name = "cosmic_caffeine"
path = "src/lib.rs"

[[bin]]
name = "cosmic-caffeine"
path = "src/main.rs"

[[bin]]
name = "cosmic-caffeine-settings"
path = "src/bin/cosmic-caffeine-settings.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
notify-rust = "4"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "0e0960f3c79138b445ae84f7ac6f91d4db36e8b4"
default-features = false
features = [
    "advanced-shaping",
    "applet",
    "tokio",
    "wgpu",
    "winit",
]

[dependencies.cosmic-config]
git = "https://github.com/pop-os/libcosmic.git"
rev = "0e0960f3c79138b445ae84f7ac6f91d4db36e8b4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
proc-macro-error2 = { git = "https://github.com/fgardt/proc-macro-error-2", rev = "53ff94b61c678593158db1a3d50269c6f0de0db7" }
